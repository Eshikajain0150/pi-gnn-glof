name: causal30-v1-release

on:
  push:
    branches: ["release/causal30_v1"]
  pull_request:
    paths:
      - "configs/causal30_v1.yaml"
      - "evidence/archive_parts/**"
      - "evidence/README.md"
      - "scripts/materialize_causal30_archive.py"
      - "scripts/verify_causal30_release.py"
      - "scripts/reproduce_tables.py"
      - "scripts/reproduce_figures.py"
      - "tests/test_causal30_release.py"
      - "requirements/causal30-release.txt"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/causal30-release.txt
      - run: python scripts/materialize_causal30_archive.py
      - run: python scripts/verify_causal30_release.py --archive evidence/causal30_v1_release.zip --json-output reproduced/verification.json
      - run: python scripts/reproduce_tables.py --archive evidence/causal30_v1_release.zip
      - run: python scripts/reproduce_figures.py --archive evidence/causal30_v1_release.zip
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: causal30-v1-reproduced-evidence
          path: reproduced/
