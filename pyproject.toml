[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pignn-glof"
version = "0.1.0"
description = "Physics-informed multimodal GNN for glacier-lake instability forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Pratham Kaushik"},
  {name = "Vinay Kukreja"},
  {name = "Eshika Jain"},
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
geo = ["rasterio>=1.3,<2", "xarray>=2024.1", "rioxarray>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
